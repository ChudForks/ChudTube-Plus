<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ChudTube+ lyrics preview</title>
    <link rel="stylesheet" href="../src/content/ytm.css" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #000;
      }
      #tab-renderer {
        display: block;
        width: 420px;
        height: 100vh;
        margin-left: auto;
        overflow: auto;
        background: #000;
      }
    </style>
  </head>
  <body>
    <ytmusic-tab-renderer id="tab-renderer" class="ctp-lyrics-visible">
      <div id="ctp-lyrics-root" class="ctp-lyrics" style='--ctp-art: url("https://i.ytimg.com/vi/placeholder/hqdefault.jpg")'>
        <div class="ctp-toolbar">
          <div class="ctp-ident">
            <div class="ctp-art" aria-hidden="true"></div>
            <div class="ctp-track">
              <div class="ctp-song">Natural Born Killer (Live at the Honda Center with an Extremely Long Subtitle)</div>
              <div class="ctp-artist">Avenged Sevenfold · Nightmare · Deluxe Edition Bonus Track</div>
            </div>
          </div>
          <div class="ctp-badge">Synced</div>
        </div>
        <div class="ctp-list">
          <button class="ctp-line ctp-line-past" type="button">
            <span class="ctp-time">0:36</span>
            <span class="ctp-body"><span class="ctp-text">One snap for the dying</span><span class="ctp-meter"></span></span>
          </button>
          <button class="ctp-line ctp-line-active" type="button" style="--ctp-progress: 0.62">
            <span class="ctp-time">0:39</span>
            <span class="ctp-body"><span class="ctp-text">One click to end the day</span><span class="ctp-meter"></span></span>
          </button>
          <button class="ctp-line ctp-line-next" type="button">
            <span class="ctp-time">0:41</span>
            <span class="ctp-body"><span class="ctp-text">Another story with a mangled scene</span><span class="ctp-meter"></span></span>
          </button>
          <button class="ctp-line ctp-line-soon" type="button">
            <span class="ctp-time">0:43</span>
            <span class="ctp-body"><span class="ctp-text">It couldn't happen any other way</span><span class="ctp-meter"></span></span>
          </button>
          <button class="ctp-line" type="button">
            <span class="ctp-time">0:47</span>
            <span class="ctp-body"><span class="ctp-text">You wanna talk about it?</span><span class="ctp-meter"></span></span>
          </button>
          <button class="ctp-line" type="button">
            <span class="ctp-time">0:49</span>
            <span class="ctp-body"><span class="ctp-text">I'm begging you to walk in my shoes any time</span><span class="ctp-meter"></span></span>
          </button>
          <button class="ctp-line" type="button">
            <span class="ctp-time">0:54</span>
            <span class="ctp-body"><span class="ctp-text">Watch the clock till you unwind</span><span class="ctp-meter"></span></span>
          </button>
        </div>
        <div class="ctp-footer">
          <span>LRCLIB</span>
        </div>
      </div>
    </ytmusic-tab-renderer>
  </body>
</html>

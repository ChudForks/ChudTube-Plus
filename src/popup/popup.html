<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChudTube+</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img class="logo" src="../../icons/icon48.png" alt="" />
      <div>
        <h1>ChudTube+</h1>
        <p>Customize YouTube and YouTube Music</p>
      </div>
    </header>

    <section class="card">
      <div class="card-head">
        <h2>YouTube</h2>
        <span class="pill">Live</span>
      </div>

      <h3 class="subsection-title">Themes</h3>
      <label class="setting">
        <div class="copy">
          <span class="setting-title">
            True OLED black
            <span class="theme-swatch" title="Pure #000"></span>
          </span>
          <span class="setting-help">
            Replace YouTube's gray dark mode with true black (#000) so OLED pixels turn off. Forces dark appearance while on.
          </span>
        </div>
        <input id="oledBlack" type="checkbox" />
      </label>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>YouTube Music</h2>
        <span class="pill">Live</span>
      </div>

      <label class="setting">
        <div class="copy">
          <span class="setting-title">Follow-along lyrics</span>
          <span class="setting-help">
            Use official YouTube Music lyrics when available, with timestamped LRCLIB lyrics for follow-along playback. Click a timed line to seek.
          </span>
        </div>
        <input id="followAlongLyrics" type="checkbox" />
      </label>
    </section>

    <footer>
      Lyrics via YouTube Music and <a href="https://lrclib.net" target="_blank" rel="noreferrer">LRCLIB</a>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
